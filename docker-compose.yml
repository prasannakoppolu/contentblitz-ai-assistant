services:
  contentblitz:
    build: .
    image: contentblitz:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      CONTENTBLITZ_MOCK: ${CONTENTBLITZ_MOCK:-0}
    volumes:
      - contentblitz-data:/data
    restart: unless-stopped

volumes:
  contentblitz-data:
