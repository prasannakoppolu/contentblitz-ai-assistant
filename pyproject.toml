[project]
name = "contentblitz"
version = "1.0.0"
description = "LangGraph multi-agent AI content marketing assistant"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = []

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"src/utils/export_tools.py" = ["E501"]
